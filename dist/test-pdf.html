<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }
    .log {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }
    .success { color: #07c160; }
    .error { color: #ff4d4f; }
    .info { color: #666; }
    button {
      padding: 10px 20px;
      background: #07c160;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PDF 文件测试</h1>
    <button onclick="testFetch()">测试 Fetch</button>
    <button onclick="testPdf()">测试 PDF.js</button>
    <div class="log" id="log"></div>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.mjs'
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'

    const logEl = document.getElementById('log')

    function log(msg, type = 'info') {
      const line = document.createElement('div')
      line.className = type
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`
      logEl.appendChild(line)
      logEl.scrollTop = logEl.scrollHeight
    }

    window.testFetch = async function() {
      logEl.innerHTML = ''
      log('开始测试 Fetch...', 'info')

      try {
        // 列出 public 目录下的文件
        log('尝试获取 PDF 文件列表...', 'info')

        const pdfFiles = ['思维模型图解 108 个.pdf', '思维模型图解 108 个.pdf']
        for (const file of pdfFiles) {
          log(`尝试：${file}`, 'info')
          try {
            const res = await fetch(`./${file}`, { method: 'HEAD' })
            log(`  Status: ${res.status} ${res.ok ? 'OK' : 'FAIL'}`, res.ok ? 'success' : 'error')
            if (res.ok) {
              const size = res.headers.get('content-length')
              log(`  文件大小：${size} bytes`, 'success')

              // 尝试加载
              const fullRes = await fetch(`./${file}`)
              const data = await fullRes.arrayBuffer()
              log(`  实际加载：${data.byteLength} bytes`, 'success')
              return file
            }
          } catch (e) {
            log(`  Error: ${e.message}`, 'error')
          }
        }
      } catch (e) {
        log(`Fetch 测试失败：${e.message}`, 'error')
      }
    }

    window.testPdf = async function() {
      logEl.innerHTML = ''
      log('开始测试 PDF.js...', 'info')

      const fileName = await window.testFetch()
      if (!fileName) {
        log('找不到 PDF 文件', 'error')
        return
      }

      try {
        log(`加载 PDF: ${fileName}`, 'info')
        const response = await fetch(`./${fileName}`)
        const pdfData = await response.arrayBuffer()
        log(`PDF 数据：${pdfData.byteLength} bytes`, 'success')

        const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise
        log(`PDF 加载成功：${pdf.numPages} 页`, 'success')

        // 尝试渲染第一页
        log('渲染第 1 页...', 'info')
        const page = await pdf.getPage(1)
        const viewport = page.getViewport({ scale: 1 })
        log(`页面尺寸：${viewport.width} x ${viewport.height}`, 'info')

        const canvas = document.createElement('canvas')
        canvas.width = viewport.width
        canvas.height = viewport.height
        const ctx = canvas.getContext('2d')

        await page.render({ canvasContext: ctx, viewport }).promise
        log('渲染成功！', 'success')

        // 显示预览
        canvas.style.maxWidth = '100%'
        canvas.style.marginTop = '10px'
        document.querySelector('.container').appendChild(canvas)
        log('预览已添加到页面底部', 'success')

      } catch (e) {
        log(`PDF 测试失败：${e.message}`, 'error')
        log(e.stack, 'error')
      }
    }
  </script>
</body>
</html>
